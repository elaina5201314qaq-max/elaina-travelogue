name: 游戏问题反馈
description: 报告启动、操作、显示、声音或存档问题。
title: "[问题] "
body:
  - type: dropdown
    id: platform
    attributes:
      label: 游戏平台
      options:
        - Windows
        - Android
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 游戏版本
      placeholder: 例如 Windows 1.3.0 / Android 1.3.1
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: 例如手机型号与 Android 版本，或电脑系统与显卡型号
  - type: textarea
    id: description
    attributes:
      label: 遇到了什么问题？
      description: 请说明操作步骤、预期表现和实际表现；涉及剧情请标注剧透。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或报错（可选）
      description: 请勿公开密码、账号凭据或未经检查的完整存档。
